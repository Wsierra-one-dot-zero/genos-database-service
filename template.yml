AWSTemplateFormatVersion: '2010-09-09'
Description: Crear instancia RDS MySQL (capa gratuita) con credenciales en Secrets Manager

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Ambiente de despliegue
  SecurityGroup:
    Type: String
    Description: Grupo de seguridad
  PublicSubnet1:
    Type: String
    Description: Subred publica 1
  PublicSubnet2:
    Type: String
    Description: Subred publica 2


Resources:

  RDSSecretsManager:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/loans/db/credentials'
      Description: !Sub '${EnvironmentName} RDS secret'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "admin"}'
        GenerateStringKey: Password
        ExcludeCharacters: '"@/\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: "Subnet group for my DB instance"
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DBInstance:
    DependsOn:
      - RDSSecretsManager
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-db-instance'
      AllocatedStorage: 20
      DBInstanceClass: db.t4g.micro
      Engine: MySQL
      EngineVersion: 8.0.41
      MasterUsername: admin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RDSSecretsManager}:SecretString:Password}}'
      PubliclyAccessible: true
      DBName: loans
      StorageType: gp2
      BackupRetentionPeriod: 0
      MultiAZ: false
      DeletionProtection: false
      VPCSecurityGroups:
        - !Ref SecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup

  RDSSecretAttachment:
    DependsOn:
      - DBInstance
      - RDSSecretsManager
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref RDSSecretsManager
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

Outputs:
  RDSInstanceEndpoint:
    Description: Endpoint de conexion al RDS
    Value: !GetAtt DBInstance.Endpoint.Address